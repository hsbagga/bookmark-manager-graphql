services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmark_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bookmark_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
