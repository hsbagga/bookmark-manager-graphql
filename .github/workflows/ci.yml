name: CI

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

env:
  DATABASE_URL: postgresql://bookmark_user:bookmark_pass@localhost:5432/bookmark_db?schema=public

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookmark_user
          POSTGRES_PASSWORD: bookmark_pass
          POSTGRES_DB: bookmark_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run lint

      - run: bun run typecheck

      - run: bunx prisma migrate deploy

      - run: bun run test

      - run: bun run test:integration
